; firmware/stackchan/platformio.ini
;
; Firmware for M5Stack's StackChan kit (CoreS3 + two SCS0009 servos) as the
; face of a lanbat voice satellite: pkgs/lva-stackchan drives it over USB.
; Build and flash: docs/stackchan.md.
;
; The Arduino core stays on 2.0.x (espressif32 6.x): it bundles esp-dl's face
; detector, which 3.x dropped.

[platformio]
default_envs = stackchan

[env:stackchan]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_qspi
upload_speed = 1500000
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    ; StackChan-BSP is written for ESP-IDF 5 (Arduino 3.x); on 4.4 the UART
    ; clock source has its older name.
    -DUART_SCLK_DEFAULT=UART_SCLK_APB
lib_deps =
    m5stack/M5Unified@0.2.25
    m5stack/M5GFX@0.2.32
    https://github.com/m5stack/StackChan-BSP.git#8d4d6fc3b7a6be379c6317c45a02a30bff8c492e
    meganetaaan/M5Stack-Avatar@0.10.0
    bblanchon/ArduinoJson@7.4.3
