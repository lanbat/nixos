name: check

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Check formatting (fix locally with nix fmt)
        run: nix fmt -- --ci

  eval:
    name: eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # One nix process per check and per host. A single `nix flake check`
      # holds every evaluation at once, which outgrows the runner's 16 GB; the
      # runner is then killed and the job reports "The operation was canceled".
      # Listing them from the flake means a new check or host cannot be left out.
      - name: Evaluate each check and host
        shell: bash
        run: |
          set -euo pipefail
          for system in x86_64-linux aarch64-linux; do
            for check in $(nix eval --json ".#checks.$system" --apply builtins.attrNames | jq -r '.[]'); do
              echo "::group::checks.$system.$check"
              nix eval --raw ".#checks.$system.$check.drvPath"
              echo; echo "::endgroup::"
            done
          done
          for host in $(nix eval --json .#nixosConfigurations --apply builtins.attrNames | jq -r '.[]'); do
            echo "::group::nixosConfigurations.$host"
            nix eval --raw ".#nixosConfigurations.$host.config.system.build.toplevel.drvPath"
            echo; echo "::endgroup::"
          done
      - name: Evaluate the formatter, apps and dev shells
        run: |
          nix eval --json .#formatter --apply 'fs: builtins.mapAttrs (_: f: f.drvPath) fs'
          nix eval --json .#apps --apply 'as: builtins.mapAttrs (_: builtins.mapAttrs (_: a: a.program)) as'
          nix eval --json .#devShells --apply 'ds: builtins.mapAttrs (_: builtins.mapAttrs (_: d: d.drvPath)) ds'

  vm-test:
    name: vm-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::This runner has no /dev/kvm; the VM test needs KVM."
            exit 1
          fi
          sudo chmod 0666 /dev/kvm
          ls -l /dev/kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      # Every x86_64 check except the full server VM test, which runs nightly.
      # Listing them from the flake means a new check cannot be left out.
      - name: Run the wiring and VM tests
        shell: bash
        run: |
          list=$(
            nix eval --json .#checks.x86_64-linux \
              --apply 'cs: builtins.filter (n: n != "server") (builtins.attrNames cs)' |
              jq -r '.[] | ".#checks.x86_64-linux." + .'
          )
          mapfile -t checks <<<"$list"
          printf '%s\n' "${checks[@]}"
          # One nix process per check: building them all in one evaluates them
          # all at once, which outgrows the runner's memory (see eval).
          for check in "${checks[@]}"; do
            nix build -L "$check"
          done

  # GitHub's arm64 runners have no /dev/kvm, so the Pi VM tests cannot boot
  # here. Building each test's driver still builds the hosts' full system
  # closures natively, which catches everything short of the boot itself.
  aarch64:
    name: aarch64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Build the Pi VM tests' systems
        shell: bash
        run: |
          list=$(
            nix eval --json .#checks.aarch64-linux --apply 'builtins.attrNames' |
              jq -r '.[] | ".#checks.aarch64-linux." + . + ".driver"'
          )
          mapfile -t drivers <<<"$list"
          printf '%s\n' "${drivers[@]}"
          nix build -L "${drivers[@]}"
