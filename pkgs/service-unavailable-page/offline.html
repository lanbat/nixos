<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Service unavailable</title>
  <style>
    :root {
      --bg: #0f172a; --surface: #1e293b; --text: #e2e8f0; --muted: #94a3b8;
      --accent: #6366f1;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif; background: var(--bg); color: var(--text);
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    }
    .card {
      max-width: 520px; background: var(--surface); border-radius: 12px;
      padding: 2rem; text-align: center;
    }
    h1 { margin: 0 0 .75rem; font-size: 1.5rem; }
    p { margin: 0; color: var(--muted); line-height: 1.6; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Service unavailable</h1>
    <p>
      The backend for this app is not running right now.
      It may be stopped, still starting, or waiting for the workload layer to be unlocked.
    </p>
    <p style="margin-top:1rem">
      <a href="https://home.@domain@/">Back to the dashboard</a>
    </p>
  </div>
</body>
</html>
