[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "frigate-person-mapper"
version = "1.0"
requires-python = ">=3.11"
dependencies = ["paho-mqtt", "websockets"]

[project.scripts]
frigate-person-mapper = "frigate_person_mapper.__main__:main"

[tool.setuptools]
packages = ["frigate_person_mapper"]
